<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قيس 💜 شادية</title>
    <meta name="description" content="محادثة خاصة بين قيس وشادية">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Chat Wallpaper Pattern -->
    <div class="wa-wallpaper"></div>

    <div class="wa-app">
        <!-- ===== Header ===== -->
        <header class="wa-header">
            <button class="wa-header-btn wa-back-btn" aria-label="رجوع">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l1.41 1.41L7.83 11H20v2H7.83l5.58 5.59L12 20l-8-8 8-8z"/></svg>
            </button>
            <div class="wa-avatar" id="avatar">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%237c3aed'/%3E%3Ctext x='32' y='40' text-anchor='middle' fill='white' font-size='28' font-family='Tajawal'%3Eق%3C/text%3E%3C/svg%3E" alt="قيس" />
            </div>
            <div class="wa-contact-info">
                <h1 class="wa-contact-name">قيس 💜</h1>
                <p class="wa-contact-status" id="profileStatus">متصل</p>
            </div>
            <div class="wa-header-actions">
                <button class="wa-header-btn" aria-label="مكالمة فيديو">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                </button>
                <button class="wa-header-btn" aria-label="مكالمة صوتية">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                </button>
                <button class="wa-header-btn" id="menuBtn" aria-label="المزيد">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            </div>
        </header>

        <!-- ===== Chat Messages Area ===== -->
        <main class="wa-chat" id="chatBody">
            <!-- Date Badge -->
            <div class="wa-date-badge">
                <span>اليوم</span>
            </div>

            <!-- Encryption Notice (like WhatsApp) -->
            <div class="wa-encryption-notice">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <span>الرسائل مشفرة تشفيراً تاماً. لا يمكن لأحد خارج هذه المحادثة قراءتها.</span>
            </div>

            <!-- Typing Indicator -->
            <div class="wa-message-row received" id="typingIndicator" style="display: none;">
                <div class="wa-bubble wa-bubble-received">
                    <div class="wa-typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                    <div class="wa-bubble-tail-received"></div>
                </div>
            </div>
        </main>

        <!-- ===== Footer / Input ===== -->
        <footer class="wa-footer">
            <div class="wa-input-row">
                <div class="wa-input-box">
                    <button class="wa-input-btn wa-emoji-btn" id="emojiBtn" aria-label="إيموجي">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                    </button>
                    <textarea 
                        id="messageInput" 
                        class="wa-text-input" 
                        placeholder="رسالة"
                        rows="1"
                        maxlength="2000"
                    ></textarea>
                    <button class="wa-input-btn wa-attach-btn" aria-label="إرفاق">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                    </button>
                </div>
                <button class="wa-send-btn" id="sendBtn" aria-label="إرسال">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>

            <!-- Emoji Picker -->
            <div class="wa-emoji-picker" id="emojiPicker">
                <div class="wa-emoji-grid">
                    <span class="wa-emoji">💜</span>
                    <span class="wa-emoji">🥰</span>
                    <span class="wa-emoji">😍</span>
                    <span class="wa-emoji">❤️</span>
                    <span class="wa-emoji">😘</span>
                    <span class="wa-emoji">🌹</span>
                    <span class="wa-emoji">😊</span>
                    <span class="wa-emoji">😅</span>
                    <span class="wa-emoji">😂</span>
                    <span class="wa-emoji">🤣</span>
                    <span class="wa-emoji">😢</span>
                    <span class="wa-emoji">😔</span>
                    <span class="wa-emoji">🤗</span>
                    <span class="wa-emoji">💕</span>
                    <span class="wa-emoji">✨</span>
                    <span class="wa-emoji">🎉</span>
                    <span class="wa-emoji">👏</span>
                    <span class="wa-emoji">🫶</span>
                    <span class="wa-emoji">💐</span>
                    <span class="wa-emoji">🌙</span>
                    <span class="wa-emoji">☀️</span>
                    <span class="wa-emoji">🤍</span>
                    <span class="wa-emoji">😇</span>
                    <span class="wa-emoji">🥺</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Splash Screen -->
    <div class="wa-splash" id="splashScreen">
        <div class="wa-splash-content">
            <div class="wa-splash-icon">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="#7c3aed"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <h2 class="wa-splash-title">قيس 💜 شادية</h2>
            <p class="wa-splash-sub">محادثتنا الخاصة</p>
            <div class="wa-splash-bar">
                <div class="wa-splash-progress"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
